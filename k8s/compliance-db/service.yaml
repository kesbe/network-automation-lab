---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: compliance-db
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: network-compliance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
