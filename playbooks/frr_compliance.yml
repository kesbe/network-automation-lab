---
- name: FRR multi-control configuration compliance
  hosts: all
  gather_facts: false

  vars:
    # Default behaviour is intentionally compatible with WF02.
    # The scheduled detector job template overrides these values.
    publish_compliance_metrics: false
    fail_on_noncompliance: true

    pushgateway_url: >-
      http://network-compliance-pushgateway.monitoring.svc.cluster.local:9091

  vars_files:
    - ../vars/compliance_intent.yml
    - ../vars/compliance_policies.yml

  tasks:

    - name: Load intended configuration
      ansible.builtin.set_fact:
        intent: "{{ network_intent[inventory_hostname] }}"
        compliance_violations: []

    - name: Collect running configuration
      ansible.builtin.raw: >
        vtysh -c 'show running-config'
      register: running_config
      changed_when: false

    - name: Collect BGP operational state
      ansible.builtin.raw: >
        vtysh -c 'show bgp ipv4 unicast summary'
      register: bgp_summary
      changed_when: false

    - name: Normalize running configuration
      ansible.builtin.set_fact:
        current_config: >-
          {{
            running_config.stdout
            | regex_replace('\r', '')
          }}

    - name: Record hostname violation
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'hostname',
              'expected': intent.hostname,
              'actual': 'missing or different'
            }]
          }}
      when: "'hostname ' ~ intent.hostname not in current_config"

    - name: Record BGP ASN violation
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'bgp_asn',
              'expected': intent.asn,
              'actual': 'missing or different'
            }]
          }}
      when: "'router bgp ' ~ (intent.asn | string) not in current_config"

    - name: Record BGP router ID violation
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'bgp_router_id',
              'expected': intent.router_id,
              'actual': 'missing or different'
            }]
          }}
      when: "'bgp router-id ' ~ intent.router_id not in current_config"

    - name: Record loopback address violation
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'loopback_address',
              'expected': intent.loopback,
              'actual': 'missing or different'
            }]
          }}
      when: "'ip address ' ~ intent.loopback not in current_config"

    - name: Record physical interface violations
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'interface_address',
              'interface': item.key,
              'expected': item.value,
              'actual': 'missing or different'
            }]
          }}
      loop: "{{ intent.interfaces | dict2items }}"
      when: >
        ('interface ' ~ item.key not in current_config) or
        ('ip address ' ~ item.value not in current_config)

    - name: Record BGP neighbor configuration violations
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'bgp_neighbor_configuration',
              'neighbor': item.ip,
              'expected_remote_as': item.remote_as,
              'expected_description': item.description,
              'actual': 'missing or different'
            }]
          }}
      loop: "{{ intent.bgp_neighbors }}"
      when: >
        ('neighbor ' ~ item.ip ~ ' remote-as ' ~ (item.remote_as | string)
         not in current_config) or
        ('neighbor ' ~ item.ip ~ ' description ' ~ item.description
         not in current_config)

    - name: Record BGP operational violations
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'bgp_neighbor_operational',
              'neighbor': item.ip,
              'expected': 'Established',
              'actual': 'neighbor missing or not established'
            }]
          }}
      loop: "{{ intent.bgp_neighbors }}"
      when: >
        (item.ip not in bgp_summary.stdout) or
        (
          bgp_summary.stdout |
          regex_search(
            '(?m)^' ~
            (item.ip | regex_escape) ~
            '.*(?:Idle|Active|Connect)'
          )
        ) is not none

    - name: Record ECMP maximum-paths violation
      ansible.builtin.set_fact:
        compliance_violations: >-
          {{
            compliance_violations +
            [{
              'control': 'maximum_paths',
              'expected': intent.maximum_paths,
              'actual': 'missing or different'
            }]
          }}
      when:
        - intent.maximum_paths is defined
        - "'maximum-paths ' ~ (intent.maximum_paths | string) not in current_config"

    - name: Validate policy metadata for detected violations
      ansible.builtin.assert:
        that:
          - policy_matches | length == 1
        fail_msg: >-
          Policy metadata lookup failed for compliance control
          {{ item.control }}. Expected exactly one enabled policy,
          found {{ policy_matches | length }}.
        success_msg: >-
          Policy metadata resolved for {{ item.control }}.
      vars:
        policy_matches: >-
          {{
            compliance_policies
            | dict2items
            | selectattr('value.enabled', 'equalto', true)
            | selectattr('value.control', 'equalto', item.control)
            | list
          }}
      loop: "{{ compliance_violations }}"
      loop_control:
        label: "{{ item.control }}"

    - name: Initialize enriched compliance violation list
      ansible.builtin.set_fact:
        enriched_compliance_violations: []

    - name: Enrich compliance violations with policy metadata
      ansible.builtin.set_fact:
        enriched_compliance_violations: >-
          {{
            enriched_compliance_violations
            +
            [
              item
              | combine(
                  {
                    'policy_id': policy_entry.key,
                    'policy_name': policy_entry.value.name,
                    'category': policy_entry.value.category,
                    'severity': policy_entry.value.severity,
                    'ticket_required': policy_entry.value.ticket_required,
                    'owner': policy_entry.value.owner,
                    'remediation': policy_entry.value.remediation
                  },
                  recursive=True
                )
            ]
          }}
      vars:
        policy_matches: >-
          {{
            compliance_policies
            | dict2items
            | selectattr('value.enabled', 'equalto', true)
            | selectattr('value.control', 'equalto', item.control)
            | list
          }}
        policy_entry: "{{ policy_matches[0] }}"
      loop: "{{ compliance_violations }}"
      loop_control:
        label: "{{ item.control }}"

    - name: Replace compliance violations with enriched findings
      ansible.builtin.set_fact:
        compliance_violations: "{{ enriched_compliance_violations }}"

    - name: Calculate compliance totals
      ansible.builtin.set_fact:
        compliance_total_checks: >-
          {{
            4
            + (intent.interfaces | length)
            + (intent.bgp_neighbors | length)
            + (intent.bgp_neighbors | length)
            + (1 if intent.maximum_paths is defined else 0)
          }}
        compliance_failed_checks: "{{ compliance_violations | length }}"

    - name: Calculate final compliance state
      ansible.builtin.set_fact:
        compliance_passed_checks: >-
          {{
            (compliance_total_checks | int)
            - (compliance_failed_checks | int)
          }}
        compliance_status: >-
          {{
            'COMPLIANT'
            if (compliance_failed_checks | int) == 0
            else 'NON-COMPLIANT'
          }}

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          device: "{{ inventory_hostname }}"
          status: "{{ compliance_status }}"
          total_checks: "{{ compliance_total_checks }}"
          passed: "{{ compliance_passed_checks }}"
          failed: "{{ compliance_failed_checks }}"
          violations: "{{ compliance_violations }}"

    - name: Publish compliance result as AWX artifact
      ansible.builtin.set_stats:
        data:
          "compliance_{{ inventory_hostname }}":
            device: "{{ inventory_hostname }}"
            status: "{{ compliance_status }}"
            total_checks: "{{ compliance_total_checks }}"
            passed: "{{ compliance_passed_checks }}"
            failed: "{{ compliance_failed_checks }}"
            violations: "{{ compliance_violations }}"
        per_host: false

    - name: Publish compliance job correlation metadata
      ansible.builtin.set_stats:
        data:
          compliance_job_id: "{{ awx_job_id | int }}"
        per_host: false
      run_once: true

    - name: Build Prometheus compliance metrics
      ansible.builtin.set_fact:
        compliance_metrics_payload: |
          # HELP network_compliance_status Network compliance state: 1 compliant, 0 non-compliant
          # TYPE network_compliance_status gauge
          network_compliance_status {{ 1 if compliance_status == 'COMPLIANT' else 0 }}
          # HELP network_compliance_violations Number of failed compliance controls
          # TYPE network_compliance_violations gauge
          network_compliance_violations {{ compliance_failed_checks | int }}
          # HELP network_compliance_total_checks Number of compliance controls evaluated
          # TYPE network_compliance_total_checks gauge
          network_compliance_total_checks {{ compliance_total_checks | int }}
          # HELP network_compliance_passed_checks Number of compliance controls that passed
          # TYPE network_compliance_passed_checks gauge
          network_compliance_passed_checks {{ compliance_passed_checks | int }}
      when: publish_compliance_metrics | bool

    - name: Publish compliance metrics to Prometheus Pushgateway
      ansible.builtin.uri:
        url: >-
          {{ pushgateway_url }}/metrics/job/network_compliance/device/{{ inventory_hostname }}
        method: PUT
        body: "{{ compliance_metrics_payload }}"
        headers:
          Content-Type: "text/plain; version=0.0.4; charset=utf-8"
        status_code:
          - 200
          - 202
        return_content: false
      delegate_to: localhost
      when: publish_compliance_metrics | bool

    - name: Display final device status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} =
          {{ compliance_status }}
          ({{ compliance_passed_checks }}/{{ compliance_total_checks }} checks passed)

    - name: Fail job for non-compliant device
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is NON-COMPLIANT.
          {{ compliance_failed_checks }} compliance control(s) failed.
          Violations: {{ compliance_violations }}
      when:
        - fail_on_noncompliance | bool
        - compliance_failed_checks | int > 0
