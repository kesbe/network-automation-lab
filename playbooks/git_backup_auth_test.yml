---
- name: Test GitHub backup repository authentication
  hosts: localhost
  gather_facts: false

  vars:
    backup_repo_url: "https://github.com/kesbe/network-config-backups.git"
    public_test_repo: "https://github.com/ansible/ansible-tower-samples.git"
    test_dir: "/tmp/network-config-backups-auth-test"
    askpass_file: "/tmp/git-backup-askpass.sh"

  tasks:

    - name: Verify AWX custom credential environment injection
      ansible.builtin.assert:
        that:
          - lookup('env', 'GIT_BACKUP_USERNAME') | length > 0
          - lookup('env', 'GIT_BACKUP_TOKEN') | length > 0
        success_msg: "PASS - AWX Git credential environment variables are present"
        fail_msg: "FAIL - AWX Git credential environment variables are missing"

    - name: Test GitHub PAT validity
      ansible.builtin.uri:
        url: https://api.github.com/user
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ lookup('env', 'GIT_BACKUP_TOKEN') }}"
        status_code:
          - 200
          - 401
          - 403
        return_content: true
      register: github_user_test
      changed_when: false
      no_log: true

    - name: Report GitHub PAT validity
      ansible.builtin.debug:
        msg: "GitHub PAT /user HTTP status={{ github_user_test.status }}"

    - name: Test GitHub repository visibility
      ansible.builtin.uri:
        url: https://api.github.com/repos/kesbe/network-config-backups
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ lookup('env', 'GIT_BACKUP_TOKEN') }}"
        status_code:
          - 200
          - 401
          - 403
          - 404
        return_content: true
      register: github_repo_test
      changed_when: false
      no_log: true

    - name: Report GitHub repository visibility
      ansible.builtin.debug:
        msg: "GitHub repository HTTP status={{ github_repo_test.status }}"

    - name: Test GitHub repository contents permission
      ansible.builtin.uri:
        url: https://api.github.com/repos/kesbe/network-config-backups/contents/README.md
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ lookup('env', 'GIT_BACKUP_TOKEN') }}"
        status_code:
          - 200
          - 401
          - 403
          - 404
        return_content: false
      register: github_contents_test
      changed_when: false
      no_log: true

    - name: Report GitHub contents permission
      ansible.builtin.debug:
        msg: "GitHub Contents API HTTP status={{ github_contents_test.status }}"

    - name: Validate GitHub PAT access
      ansible.builtin.assert:
        that:
          - github_user_test.status | int == 200
          - github_repo_test.status | int == 200
          - github_contents_test.status | int == 200
        success_msg: "PASS - PAT is valid and can read network-config-backups"
        fail_msg: >-
          FAIL - PAT validity or repository permissions are incorrect.
          Check the three HTTP status codes above.

    - name: Verify generic GitHub connectivity
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - "{{ public_test_repo }}"
          - HEAD
      register: github_connectivity
      changed_when: false

    - name: Display GitHub connectivity result
      ansible.builtin.debug:
        msg: "PASS - GitHub connectivity works"

    - name: Remove previous test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: absent

    - name: Test authenticated Git access
      block:

        - name: Create temporary Git askpass helper
          ansible.builtin.copy:
            dest: "{{ askpass_file }}"
            mode: "0700"
            content: |
              #!/bin/sh
              case "$1" in
                *Username*)
                  printf '%s\n' "$GIT_BACKUP_USERNAME"
                  ;;
                *Password*)
                  printf '%s\n' "$GIT_BACKUP_TOKEN"
                  ;;
              esac
          no_log: true

        - name: Test access to private backup repository
          ansible.builtin.command:
            argv:
              - git
              - ls-remote
              - "{{ backup_repo_url }}"
              - HEAD
          environment:
            GIT_ASKPASS: "{{ askpass_file }}"
            GIT_TERMINAL_PROMPT: "0"
          register: private_repo_test
          changed_when: false
          failed_when: false
          no_log: true

        - name: Report authenticated Git return code
          ansible.builtin.debug:
            msg: "Authenticated Git test rc={{ private_repo_test.rc | default(-1) }}"

        - name: Verify authenticated repository access
          ansible.builtin.assert:
            that:
              - private_repo_test.rc | int == 0
            success_msg: "PASS - AWX credential can authenticate to network-config-backups"
            fail_msg: >-
              FAIL - credential injection and GitHub connectivity work,
              but authenticated access to network-config-backups failed.

        - name: Clone backup repository
          ansible.builtin.command:
            argv:
              - git
              - clone
              - --depth
              - "1"
              - "{{ backup_repo_url }}"
              - "{{ test_dir }}"
          environment:
            GIT_ASKPASS: "{{ askpass_file }}"
            GIT_TERMINAL_PROMPT: "0"
          register: clone_result
          changed_when: false
          no_log: true

        - name: Verify cloned repository
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ test_dir }}"
              - rev-parse
              - --is-inside-work-tree
          register: repo_check
          changed_when: false

        - name: Display final authentication result
          ansible.builtin.debug:
            msg: >-
              GitHub backup repository authentication successful:
              {{ repo_check.stdout }}

      always:

        - name: Remove temporary credentials helper
          ansible.builtin.file:
            path: "{{ askpass_file }}"
            state: absent
