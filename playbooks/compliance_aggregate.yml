---
- name: Aggregate network compliance findings
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/compliance_intent.yml

  tasks:

    - name: Initialize compliance aggregation
      ansible.builtin.set_fact:
        compliance_device_results: []
        compliance_findings: []

    - name: Validate per-device compliance artifacts
      ansible.builtin.assert:
        that:
          - vars['compliance_' ~ item] is defined
          - vars['compliance_' ~ item] is mapping
          - vars['compliance_' ~ item].device is defined
          - vars['compliance_' ~ item].status is defined
          - vars['compliance_' ~ item].violations is defined
        fail_msg: >-
          Missing or invalid compliance artifact for device {{ item }}.
        success_msg: >-
          Compliance artifact validated for {{ item }}.
      loop: "{{ network_intent.keys() | list | sort }}"

    - name: Collect per-device compliance results
      ansible.builtin.set_fact:
        compliance_device_results: >-
          {{
            compliance_device_results
            +
            [
              vars['compliance_' ~ item]
            ]
          }}
      loop: "{{ network_intent.keys() | list | sort }}"

    - name: Initialize authoritative V3 target inventory
      ansible.builtin.set_fact:
        aggregated_v3_target_inventory: []

    - name: Validate authoritative V3 target metadata
      ansible.builtin.assert:
        that:
          - hostvars[item] is defined
          - hostvars[item].platform is defined
          - hostvars[item].platform is string
          - hostvars[item].platform | trim | length > 0
          - hostvars[item].manufacturer is defined
          - hostvars[item].manufacturer is string
          - hostvars[item].manufacturer | trim | length > 0
        fail_msg: >-
          Authoritative NetBox inventory metadata is missing
          mandatory V3 identity fields for {{ item }}.
      loop: "{{ network_intent.keys() | list | sort }}"

    - name: Build authoritative V3 target inventory
      ansible.builtin.set_fact:
        aggregated_v3_target_inventory: >-
          {{
            aggregated_v3_target_inventory
            +
            [
              (
                {
                  'name': item,
                  'platform': hostvars[item].platform,
                  'vendor': hostvars[item].manufacturer,
                  'tags': (
                    hostvars[item].tags
                    | default([])
                  )
                }
                | combine(
                    (
                      {
                        'site': hostvars[item].site
                      }
                      if hostvars[item].site is defined
                      else {}
                    )
                  )
                | combine(
                    (
                      {
                        'role': hostvars[item].role
                      }
                      if hostvars[item].role is defined
                      else {}
                    )
                  )
              )
            ]
          }}
      loop: "{{ network_intent.keys() | list | sort }}"

    - name: Build V3 target resolver input
      ansible.builtin.set_fact:
        aggregated_v3_target_resolver_input: >-
          {{
            {
              'selector': {
                'devices': (
                  network_intent.keys()
                  | list
                  | sort
                )
              },
              'inventory':
                aggregated_v3_target_inventory
            }
          }}

    - name: Resolve canonical V3 target
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - >-
            {{
              playbook_dir
              ~ '/../scripts/v3_target_resolver.py'
            }}
        stdin: >-
          {{
            aggregated_v3_target_resolver_input
            | to_json
          }}
      register: aggregated_v3_target_resolver_command
      changed_when: false

    - name: Validate V3 target resolver execution
      ansible.builtin.assert:
        that:
          - aggregated_v3_target_resolver_command.rc == 0
          - aggregated_v3_target_resolver_command.stdout is string
          - >-
            aggregated_v3_target_resolver_command.stdout
            | trim
            | length
            > 0
        fail_msg: >-
          Canonical V3 target resolution failed.

    - name: Capture canonical V3 resolved target
      ansible.builtin.set_fact:
        aggregated_v3_resolved_target: >-
          {{
            aggregated_v3_target_resolver_command.stdout
            | from_json
          }}

    - name: Validate resolved target against aggregated run membership
      ansible.builtin.assert:
        that:
          - aggregated_v3_resolved_target is mapping
          - aggregated_v3_resolved_target.schema_version is defined
          - >-
            aggregated_v3_resolved_target.schema_version
            | string
            == '3.0'
          - aggregated_v3_resolved_target.target_id is defined
          - >-
            aggregated_v3_resolved_target.target_id
            | string
            | length
            > 0
          - aggregated_v3_resolved_target.selector is mapping
          - >-
            aggregated_v3_resolved_target.selector.devices
            ==
            (
              network_intent.keys()
              | list
              | sort
            )
          - >-
            aggregated_v3_resolved_target.device_names
            ==
            (
              network_intent.keys()
              | list
              | sort
            )
          - >-
            aggregated_v3_resolved_target.device_count
            | int
            ==
            (
              network_intent.keys()
              | list
              | length
            )
          - >-
            (
              compliance_device_results
              | map(attribute='device')
              | list
              | sort
            )
            ==
            aggregated_v3_resolved_target.device_names
        fail_msg: >-
          Resolved V3 target does not exactly match the
          aggregated compliance-run membership.

    - name: Validate enriched compliance finding contract
      ansible.builtin.assert:
        that:
          - item.1.control is defined
          - item.1.policy_id is defined
          - item.1.policy_name is defined
          - item.1.category is defined
          - item.1.severity is defined
          - item.1.ticket_required is defined
          - item.1.ticket_required is boolean
          - item.1.owner is defined
          - item.1.remediation is defined
          - item.1.remediation is mapping
          - item.1.remediation.mode is defined
          - item.1.remediation.risk is defined
          - item.1.remediation.supported is defined
        fail_msg: >-
          Invalid enriched compliance finding for
          {{ item.0.device }} /
          {{ item.1.control | default('UNKNOWN') }}.
        success_msg: >-
          Enriched finding contract validated for
          {{ item.0.device }} /
          {{ item.1.policy_id }}.
      loop: >-
        {{
          query(
            'ansible.builtin.subelements',
            compliance_device_results,
            'violations',
            {
              'skip_missing': true
            }
          )
        }}
      loop_control:
        label: >-
          {{
            item.0.device
          }}
          /
          {{
            item.1.policy_id
            | default(item.1.control | default('UNKNOWN'))
          }}

    - name: Flatten compliance violations into findings
      ansible.builtin.set_fact:
        compliance_findings: >-
          {{
            compliance_findings
            +
            [
              item.1
              | combine(
                  {
                    'device': item.0.device,
                    'device_status': item.0.status,
                    'finding_scope': finding_scope,
                    'finding_fingerprint': finding_fingerprint,
                    'finding_id': finding_id
                  },
                  recursive=True
                )
            ]
          }}
      vars:
        finding_interface: >-
          {{
            (
              item.1.interface
              | default('', true)
            )
            if item.1.interface is defined
            else
            (
              (
                item.1.expected.get(
                  'interface',
                  ''
                )
                | default('', true)
              )
              if item.1.expected is mapping
              else
              (
                (
                  item.1.actual.get(
                    'interface',
                    ''
                  )
                  | default('', true)
                )
                if item.1.actual is mapping
                else
                ''
              )
            )
          }}

        finding_neighbor: >-
          {{
            (
              item.1.neighbor
              | default('', true)
            )
            if item.1.neighbor is defined
            else
            (
              (
                item.1.expected.get(
                  'neighbor',
                  ''
                )
                | default('', true)
              )
              if item.1.expected is mapping
              else
              (
                (
                  item.1.actual.get(
                    'neighbor',
                    ''
                  )
                  | default('', true)
                )
                if item.1.actual is mapping
                else
                ''
              )
            )
          }}

        finding_scope: >-
          {{
            (
              'interface:' ~ finding_interface
            )
            if (
              finding_interface
              | string
              | length
            ) > 0
            else
            (
              (
                'neighbor:' ~ finding_neighbor
              )
              if (
                finding_neighbor
                | string
                | length
              ) > 0
              else
              'device'
            )
          }}

        finding_fingerprint: >-
          {{
            item.0.device
            ~ '|'
            ~ item.1.policy_id
            ~ '|'
            ~ finding_scope
          }}

        finding_id: >-
          {{
            'finding-'
            ~
            (
              finding_fingerprint
              | hash('sha256')
            )[:20]
          }}

      loop: >-
        {{
          query(
            'ansible.builtin.subelements',
            compliance_device_results,
            'violations',
            {
              'skip_missing': true
            }
          )
        }}
      loop_control:
        label: >-
          {{
            item.0.device
          }}
          /
          {{
            item.1.policy_id
          }}
          /
          {{
            finding_scope
          }}

    - name: Build severity routed finding collections
      ansible.builtin.set_fact:
        compliance_critical_findings: >-
          {{
            compliance_findings
            | selectattr(
                'severity',
                'equalto',
                'critical'
              )
            | selectattr(
                'ticket_required',
                'equalto',
                true
              )
            | list
          }}

        compliance_high_findings: >-
          {{
            compliance_findings
            | selectattr(
                'severity',
                'equalto',
                'high'
              )
            | list
          }}

        compliance_medium_findings: >-
          {{
            compliance_findings
            | selectattr(
                'severity',
                'equalto',
                'medium'
              )
            | list
          }}

        compliance_low_findings: >-
          {{
            compliance_findings
            | selectattr(
                'severity',
                'equalto',
                'low'
              )
            | list
          }}

        compliance_info_findings: >-
          {{
            compliance_findings
            | selectattr(
                'severity',
                'equalto',
                'info'
              )
            | list
          }}

    - name: Build compliance run summary
      ansible.builtin.set_fact:
        compliance_summary: >-
          {{
            {
              'devices_checked':
                (
                  compliance_device_results
                  | length
                ),

              'devices_compliant':
                (
                  compliance_device_results
                  | selectattr(
                      'status',
                      'equalto',
                      'COMPLIANT'
                    )
                  | list
                  | length
                ),

              'devices_noncompliant':
                (
                  compliance_device_results
                  | selectattr(
                      'status',
                      'equalto',
                      'NON_COMPLIANT'
                    )
                  | list
                  | length
                ),

              'total_findings':
                (
                  compliance_findings
                  | length
                ),

              'critical_findings':
                (
                  compliance_critical_findings
                  | length
                ),

              'high_findings':
                (
                  compliance_high_findings
                  | length
                ),

              'medium_findings':
                (
                  compliance_medium_findings
                  | length
                ),

              'low_findings':
                (
                  compliance_low_findings
                  | length
                ),

              'info_findings':
                (
                  compliance_info_findings
                  | length
                )
            }
          }}

    - name: Generate compliance run identity
      ansible.builtin.set_fact:
        generated_compliance_run_id: >-
          {{
            compliance_run_id
            if (
              compliance_run_id is defined
              and
              (
                compliance_run_id
                | string
                | trim
                | length
              ) > 0
            )
            else
            (
              'compliance-'
              ~ lookup(
                  'ansible.builtin.pipe',
                  "python3 -c 'import uuid; print(uuid.uuid4())'"
                )
            )
          }}

        generated_compliance_timestamp: >-
          {{
            lookup(
              'ansible.builtin.pipe',
              'date -u +%Y-%m-%dT%H:%M:%SZ'
            )
          }}

    - name: Build structured compliance run
      ansible.builtin.set_fact:
        aggregated_compliance_run:
          schema_version: "1.0"

          run_id: >-
            {{
              generated_compliance_run_id
            }}

          generated_at: >-
            {{
              generated_compliance_timestamp
            }}

          summary: >-
            {{
              compliance_summary
            }}

          device_results: >-
            {{
              compliance_device_results
            }}

          findings: >-
            {{
              compliance_findings
            }}

          critical_findings: >-
            {{
              compliance_critical_findings
            }}

    - name: Display compliance run summary
      ansible.builtin.debug:
        var: compliance_summary

    - name: Display critical ticket findings
      ansible.builtin.debug:
        var: compliance_critical_findings

    - name: Publish structured compliance run and V3 target artifacts
      ansible.builtin.set_stats:
        data:
          compliance_run: >-
            {{
              aggregated_compliance_run
            }}
          resolved_target: >-
            {{
              aggregated_v3_resolved_target
            }}
          v3_persistence_enabled: true
        per_host: false

    - name: Publish compliance aggregation correlation metadata
      ansible.builtin.set_stats:
        data:
          compliance_job_id: "{{ compliance_job_id | default('') }}"
          aggregator_job_id: "{{ awx_job_id | int }}"
          workflow_job_id: "{{ awx_workflow_job_id | default('') }}"
        per_host: false
