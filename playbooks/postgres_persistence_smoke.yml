---
- name: PostgreSQL persistence connectivity and API smoke test
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    pg_host: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_HOST') }}"
    pg_port: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_PORT') }}"
    pg_database: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_DATABASE') }}"
    pg_username: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_USERNAME') }}"
    pg_password: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_PASSWORD') }}"
    pg_sslmode: "{{ lookup('ansible.builtin.env', 'NETAUTO_PG_SSLMODE') }}"

  tasks:
    - name: Validate non-secret PostgreSQL credential inputs
      ansible.builtin.assert:
        that:
          - pg_host | length > 0
          - pg_port | length > 0
          - pg_database == 'network_compliance'
          - pg_username == 'compliance_writer'
          - pg_sslmode == 'disable'
        fail_msg: PostgreSQL credential metadata is missing or unexpected

    - name: Validate PostgreSQL password injection
      ansible.builtin.assert:
        that:
          - pg_password | length > 0
        fail_msg: PostgreSQL password was not injected
      no_log: true

    - name: Exercise PostgreSQL writer through approved API and roll back
      community.postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port | int }}"
        login_db: "{{ pg_database }}"
        login_user: "{{ pg_username }}"
        login_password: "{{ pg_password }}"
        ssl_mode: "{{ pg_sslmode }}"
        connect_params:
          connect_timeout: 10
        autocommit: true
        query:
          - BEGIN
          - |
            SELECT
              current_database() AS current_database,
              current_user AS current_user,
              session_user AS session_user,
              has_function_privilege(
                current_user,
                'compliance.ingest_compliance_run(jsonb,bigint,bigint,bigint,text,text)',
                'EXECUTE'
              ) AS run_api_execute,
              has_table_privilege(
                current_user,
                'compliance.compliance_runs',
                'SELECT'
              ) AS direct_table_select,
              has_table_privilege(
                current_user,
                'compliance.compliance_runs',
                'INSERT'
              ) AS direct_table_insert
          - |
            SELECT *
            FROM compliance.ingest_compliance_run(
              '{
                "schema_version": "1.0",
                "run_id": "awx-postgres-smoke",
                "generated_at": "2026-08-21T00:00:00Z",
                "summary": {
                  "devices_checked": 0,
                  "devices_compliant": 0,
                  "devices_noncompliant": 0,
                  "total_findings": 0,
                  "critical_findings": 0,
                  "high_findings": 0,
                  "medium_findings": 0,
                  "low_findings": 0,
                  "info_findings": 0
                },
                "device_results": [],
                "findings": [],
                "critical_findings": []
              }'::jsonb,
              NULL,
              NULL,
              NULL,
              'awx-ee-smoke',
              'compliance_writer'
            )
          - ROLLBACK
          - |
            SELECT
              current_user AS current_user,
              true AS rollback_completed
      register: postgres_smoke
      no_log: true

    - name: Validate PostgreSQL smoke-test result structure
      ansible.builtin.assert:
        that:
          - postgres_smoke.query_all_results is defined
          - postgres_smoke.query_all_results | length == 5
          - postgres_smoke.query_all_results[1] | length == 1
          - postgres_smoke.query_all_results[2] | length == 1
          - postgres_smoke.query_all_results[4] | length == 1

    - name: Capture safe PostgreSQL smoke results
      ansible.builtin.set_fact:
        postgres_identity: "{{ postgres_smoke.query_all_results[1][0] }}"
        postgres_api_result: "{{ postgres_smoke.query_all_results[2][0] }}"
        postgres_rollback_result: "{{ postgres_smoke.query_all_results[4][0] }}"

    - name: Assert least-privilege PostgreSQL identity
      ansible.builtin.assert:
        that:
          - postgres_identity.current_database == 'network_compliance'
          - postgres_identity.current_user == 'compliance_writer'
          - postgres_identity.session_user == 'compliance_writer'
          - postgres_identity.run_api_execute | bool
          - not (postgres_identity.direct_table_select | bool)
          - not (postgres_identity.direct_table_insert | bool)

    - name: Assert approved ingestion API succeeded
      ansible.builtin.assert:
        that:
          - postgres_api_result.result_run_id == 'awx-postgres-smoke'
          - postgres_api_result.result_status == 'INSERTED'
          - postgres_api_result.run_inserted | bool
          - postgres_api_result.device_results_inserted | int == 0
          - postgres_api_result.findings_processed | int == 0

    - name: Assert transaction rollback completed
      ansible.builtin.assert:
        that:
          - postgres_rollback_result.current_user == 'compliance_writer'
          - postgres_rollback_result.rollback_completed | bool

    - name: Report safe PostgreSQL smoke-test result
      ansible.builtin.debug:
        msg:
          database: "{{ postgres_identity.current_database }}"
          database_user: "{{ postgres_identity.current_user }}"
          run_api_execute: "{{ postgres_identity.run_api_execute }}"
          direct_table_select: "{{ postgres_identity.direct_table_select }}"
          direct_table_insert: "{{ postgres_identity.direct_table_insert }}"
          ingestion_status: "{{ postgres_api_result.result_status }}"
          run_inserted: "{{ postgres_api_result.run_inserted }}"
          rollback_completed: "{{ postgres_rollback_result.rollback_completed }}"
