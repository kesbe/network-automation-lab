---
compliance_policies:

  NET-SYS-001:
    name: Network device hostname
    description: >
      Validate the configured device hostname against the
      approved network intent.
    control: hostname

    category: system
    severity: medium

    ticket_required: false

    remediation:
      supported: false
      mode: report_only
      risk: low

    owner: network_operations

    enabled: true


  NET-BGP-001:
    name: BGP neighbor configuration
    description: >
      Validate BGP neighbor remote-AS and description against
      the approved network intent.
    control: bgp_neighbor_configuration

    category: routing
    severity: critical

    ticket_required: true

    remediation:
      supported: true
      mode: approval_required
      risk: high

    owner: network_operations

    enabled: true


  NET-BGP-002:
    name: BGP ECMP maximum paths
