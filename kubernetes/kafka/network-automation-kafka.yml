apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: network-automation-kafka
  namespace: kafka

spec:
  kafka:

    version: 4.2.1
    metadataVersion: "4.2"

    listeners:

      - name: plain
        port: 9092
        type: internal
        tls: false

    rack:
      type: topology-label
      topologyKey: topology.kubernetes.io/zone

    config:

      default.replication.factor: 3

      min.insync.replicas: 2

      offsets.topic.replication.factor: 3

      transaction.state.log.replication.factor: 3

      transaction.state.log.min.isr: 2

  entityOperator:

    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
