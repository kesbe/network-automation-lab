apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: network-compliance-events
  namespace: kafka
  labels:
    strimzi.io/cluster: network-automation-kafka
spec:
  topicName: network.compliance.events
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: delete
---
