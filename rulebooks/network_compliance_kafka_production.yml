---
- name: Network Compliance Kafka Production
  hosts: localhost

  sources:
    - name: Network compliance production events
      ansible.eda.kafka:
        host: network-automation-kafka-kafka-bootstrap.kafka.svc
        port: 9092
        topic: network.compliance.events
        group_id: eda-network-compliance-production-v1
        offset: latest

  rules:
    - name: Launch governed durable network compliance transport workflow
      condition: >
        event.body.event_type ==
        "NETWORK_COMPLIANCE_DRIFT_DETECTED"

      action:
        run_workflow_template:
          name: "WF03-T-NB - Durable Compliance Transport Wrapper"
          organization: "Default"

          # The wrapper requires the durable transport identity.
          # Only the validated event identity/correlation fields
          # are injected into AWX.
          include_events: false
          job_args:
            extra_vars:
              transport_event_id: "{{ event.body.event_id }}"
              transport_event_type: "{{ event.body.event_type }}"
              compliance_run_id: "{{ event.body.correlation.compliance_run_id }}"

          # Never allow the EDA action layer to launch
          # a second workflow automatically.
          retry: false
          retries: 0
          delay: 0

          # Do not feed workflow completion/state back
          # into this production ruleset.
          set_facts: false
          post_events: false
          add_event_uuid_label: false
